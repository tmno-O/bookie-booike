include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

queues {
  "booking-requests.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
  }
}
